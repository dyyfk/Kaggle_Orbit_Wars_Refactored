<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="960" viewBox="0 0 760 960">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/>
    </marker>
    <marker id="arr-rule" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b04200"/>
    </marker>
    <style type="text/css"><![CDATA[
      .box   { fill: #ffffff; stroke: #222; stroke-width: 1.5; }
      .rule  { fill: #ffe0b3; stroke: #222; stroke-width: 1.5; }
      .cand  { fill: #d8e8f8; stroke: #222; stroke-width: 1.5; }
      .sum   { fill: #ffe0b3; stroke: #222; stroke-width: 1.5; }
      .out   { fill: #ffffff; stroke: #222; stroke-width: 1.5; }
      .lbl   { font-family: Arial, Helvetica, sans-serif; font-size: 13px; fill: #222; text-anchor: middle; }
      .head  { font-family: Arial, Helvetica, sans-serif; font-size: 16px; fill: #222; text-anchor: middle; font-style: italic; }
      .annot { font-family: Arial, Helvetica, sans-serif; font-size: 11px; fill: #666; text-anchor: middle; font-style: italic; }
      .annot-rule { font-family: Arial, Helvetica, sans-serif; font-size: 11px; fill: #b04200; text-anchor: middle; font-style: italic; }
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 14px; fill: #222; text-anchor: middle; font-weight: bold; }
      .a      { stroke: #222; stroke-width: 1.3; fill: none; }
      .a-rule { stroke: #b04200; stroke-width: 1.6; fill: none; }
    ]]></style>
  </defs>

  <text x="380" y="22" class="title">MLP residual scorer  (per turn, per candidate)</text>

  <!-- Output: policy distribution -->
  <text x="380" y="58" class="head">&#960;( a | o<tspan baseline-shift="sub" font-size="10">t</tspan> )</text>

  <!-- Argmax / Softmax box -->
  <rect x="240" y="75" width="280" height="42" class="box"/>
  <text x="380" y="101" class="lbl">Argmax  (eval)   /   Softmax( &#183; / T )  (train)</text>
  <line x1="380" y1="75" x2="380" y2="65" class="a" marker-end="url(#arr)"/>

  <!-- Score vector -->
  <rect x="240" y="140" width="280" height="48" class="box"/>
  <text x="380" y="160" class="lbl">score<tspan baseline-shift="sub" font-size="10">k</tspan>  =  rule<tspan baseline-shift="sub" font-size="10">k</tspan>  +  &#916;<tspan baseline-shift="sub" font-size="10">k</tspan></text>
  <text x="380" y="178" class="annot">K-dim vector over candidates</text>
  <line x1="380" y1="140" x2="380" y2="117" class="a" marker-end="url(#arr)"/>

  <!-- Sum (highlighted) -->
  <rect x="350" y="218" width="60" height="42" class="sum"/>
  <text x="380" y="247" class="lbl" font-size="20" font-weight="bold">+</text>
  <line x1="380" y1="218" x2="380" y2="188" class="a" marker-end="url(#arr)"/>

  <!-- Left branch: rule_score (residual, highlighted) -->
  <rect x="60" y="300" width="220" height="42" class="rule"/>
  <text x="170" y="327" class="lbl">rule<tspan baseline-shift="sub" font-size="10">k</tspan>   (heuristic score)</text>
  <line x1="240" y1="300" x2="356" y2="260" class="a-rule" marker-end="url(#arr-rule)"/>

  <!-- Right branch top: Δ -->
  <rect x="480" y="300" width="220" height="42" class="box"/>
  <text x="590" y="327" class="lbl">&#916;<tspan baseline-shift="sub" font-size="10">k</tspan>   (MLP delta)</text>
  <line x1="520" y1="300" x2="404" y2="260" class="a" marker-end="url(#arr)"/>

  <!-- Scaled tanh -->
  <rect x="480" y="365" width="220" height="42" class="box"/>
  <text x="590" y="392" class="lbl">Scaled  tanh   (cap &#177;100)</text>
  <line x1="590" y1="365" x2="590" y2="342" class="a" marker-end="url(#arr)"/>

  <!-- Linear 32 -> 1 -->
  <rect x="480" y="430" width="220" height="42" class="box"/>
  <text x="590" y="457" class="lbl">Linear   (32 &#8594; 1)</text>
  <line x1="590" y1="430" x2="590" y2="407" class="a" marker-end="url(#arr)"/>

  <!-- tanh -->
  <rect x="480" y="495" width="220" height="42" class="box"/>
  <text x="590" y="522" class="lbl">tanh</text>
  <line x1="590" y1="495" x2="590" y2="472" class="a" marker-end="url(#arr)"/>

  <!-- Linear 16 -> 32 -->
  <rect x="480" y="560" width="220" height="42" class="box"/>
  <text x="590" y="587" class="lbl">Linear   (16 &#8594; 32)</text>
  <line x1="590" y1="560" x2="590" y2="537" class="a" marker-end="url(#arr)"/>

  <!-- Z-score normalize -->
  <rect x="480" y="625" width="220" height="42" class="box"/>
  <text x="590" y="652" class="lbl">Z-score normalize   (f &#8722; &#956;) / &#963;</text>
  <line x1="590" y1="625" x2="590" y2="602" class="a" marker-end="url(#arr)"/>

  <!-- 16 features -->
  <rect x="480" y="690" width="220" height="42" class="box"/>
  <text x="590" y="717" class="lbl">16  features<tspan baseline-shift="sub" font-size="10">k</tspan></text>
  <line x1="590" y1="690" x2="590" y2="667" class="a" marker-end="url(#arr)"/>

  <!-- Candidate generator (rule-based) -->
  <rect x="220" y="785" width="320" height="42" class="cand"/>
  <text x="380" y="811" class="lbl">Candidate generator  (rule-based)</text>

  <!-- arrows from cand gen to both branches -->
  <line x1="520" y1="785" x2="590" y2="732" class="a" marker-end="url(#arr)"/>
  <line x1="240" y1="785" x2="170" y2="342" class="a-rule" marker-end="url(#arr-rule)"/>

  <!-- Observation -->
  <text x="380" y="877" class="head">o<tspan baseline-shift="sub" font-size="10">t</tspan>   (game state)</text>
  <line x1="380" y1="855" x2="380" y2="827" class="a" marker-end="url(#arr)"/>

  <!-- Side annotations -->
  <text x="170" y="370" class="annot-rule">frozen, hand-crafted</text>
  <text x="590" y="278" class="annot">learned</text>

  <!-- Legend / footer -->
  <text x="60" y="918" class="annot-rule" text-anchor="start">&#9632; orange  =  rule residual  (frozen heuristic)</text>
  <text x="60" y="936" class="annot" text-anchor="start">&#9633; white   =  MLP scorer  (PyTorch; trained via REINFORCE with moving baseline)</text>
  <text x="60" y="954" class="annot" text-anchor="start">&#9632; blue    =  shared candidate generator  (rule-based; per-turn produces K candidates)</text>

</svg>
