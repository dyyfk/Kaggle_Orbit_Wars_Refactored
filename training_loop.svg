<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="820" height="1000" viewBox="0 0 820 1000">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/>
    </marker>
    <marker id="arr-rule" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b04200"/>
    </marker>
    <style type="text/css"><![CDATA[
      .box   { fill: #ffffff; stroke: #222; stroke-width: 1.5; }
      .rule  { fill: #ffe0b3; stroke: #222; stroke-width: 1.5; }
      .cand  { fill: #d8e8f8; stroke: #222; stroke-width: 1.5; }
      .lbl   { font-family: Arial, Helvetica, sans-serif; font-size: 13px; fill: #222; text-anchor: middle; }
      .lblsmall { font-family: Arial, Helvetica, sans-serif; font-size: 11px; fill: #222; text-anchor: middle; }
      .head  { font-family: Arial, Helvetica, sans-serif; font-size: 16px; fill: #222; text-anchor: middle; font-style: italic; }
      .annot { font-family: Arial, Helvetica, sans-serif; font-size: 11px; fill: #666; text-anchor: middle; font-style: italic; }
      .annot-rule { font-family: Arial, Helvetica, sans-serif; font-size: 11px; fill: #b04200; text-anchor: middle; font-style: italic; }
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 14px; fill: #222; text-anchor: middle; font-weight: bold; }
      .a      { stroke: #222; stroke-width: 1.3; fill: none; }
      .a-rule { stroke: #b04200; stroke-width: 1.6; fill: none; }
      .a-dash { stroke: #222; stroke-width: 1.3; fill: none; stroke-dasharray: 5 4; }
    ]]></style>
  </defs>

  <text x="410" y="22" class="title">REINFORCE-with-baseline training loop  (per outer step)</text>

  <text x="280" y="56" class="head">step k</text>

  <!-- Block 1: sample B episodes -->
  <rect x="80" y="72" width="400" height="48" class="cand"/>
  <text x="280" y="92" class="lbl">Sample B episodes:  opp<tspan baseline-shift="sub" font-size="10">b</tspan> ~ Uniform{ self, medium.py, starter }</text>
  <text x="280" y="110" class="annot">B = batch size (default 16-24)</text>

  <!-- Block 2: parallel rollout workers -->
  <rect x="80" y="148" width="400" height="106" class="cand"/>
  <text x="280" y="168" class="lbl">Parallel rollout workers   (ProcessPoolExecutor)</text>
  <text x="280" y="190" class="lblsmall">per turn:   sample top-1  ~  softmax( (rule + &#916;) / T )</text>
  <text x="280" y="207" class="lblsmall">                  greedy fill rest of 12-move budget</text>
  <text x="280" y="228" class="lblsmall">log  (features, rule_scores, chosen)  for player 0</text>
  <text x="280" y="247" class="annot">policy &#952; broadcast to each worker via pickled payload</text>
  <line x1="280" y1="148" x2="280" y2="120" class="a" marker-end="url(#arr)"/>

  <!-- Block 3: episode returns -->
  <rect x="80" y="282" width="400" height="44" class="rule"/>
  <text x="280" y="309" class="lbl">Episode return  R<tspan baseline-shift="sub" font-size="10">b</tspan>   (kaggle_environments orbit_wars)</text>
  <line x1="280" y1="282" x2="280" y2="254" class="a" marker-end="url(#arr)"/>

  <!-- Block 4: EMA baseline + advantage -->
  <rect x="80" y="354" width="400" height="60" class="box"/>
  <text x="280" y="376" class="lbl">EMA baseline   V  &#8592;  (1 &#8722; &#945;)&#183;V  +  &#945;&#183;mean(R<tspan baseline-shift="sub" font-size="10">b</tspan>)    ,   &#945; = 0.05</text>
  <text x="280" y="400" class="lbl">advantage   A<tspan baseline-shift="sub" font-size="10">b</tspan>  =  R<tspan baseline-shift="sub" font-size="10">b</tspan>  &#8722;  V</text>
  <line x1="280" y1="354" x2="280" y2="326" class="a" marker-end="url(#arr)"/>

  <!-- Block 5: listwise PG loss -->
  <rect x="80" y="442" width="400" height="60" class="box"/>
  <text x="280" y="464" class="lbl">listwise REINFORCE loss</text>
  <text x="280" y="488" class="lbl">L = &#8722; mean<tspan baseline-shift="sub" font-size="10">b,t</tspan>  [ log softmax((rule + &#916;) / T)<tspan baseline-shift="sub" font-size="10">chosen</tspan>  &#183; A<tspan baseline-shift="sub" font-size="10">b</tspan> ]</text>
  <line x1="280" y1="442" x2="280" y2="414" class="a" marker-end="url(#arr)"/>

  <!-- Block 6: Adam step -->
  <rect x="80" y="530" width="400" height="44" class="box"/>
  <text x="280" y="557" class="lbl">Adam   (lr = 3e-4,    clip &#8214;&#8711;&#8214; &#8804; 1.0)</text>
  <line x1="280" y1="530" x2="280" y2="502" class="a" marker-end="url(#arr)"/>

  <!-- Block 7: update feature stats -->
  <rect x="80" y="602" width="400" height="44" class="box"/>
  <text x="280" y="629" class="lbl">FEATURE_MEAN / FEATURE_STD   &#8592;   EMA   (&#945; = 0.1)</text>
  <line x1="280" y1="602" x2="280" y2="574" class="a" marker-end="url(#arr)"/>

  <!-- Block 8: sync weights -->
  <rect x="80" y="674" width="400" height="44" class="rule"/>
  <text x="280" y="701" class="lbl">sync &#952;   &#8594;   main.py module globals</text>
  <line x1="280" y1="674" x2="280" y2="646" class="a" marker-end="url(#arr)"/>

  <!-- Loop back arrow on the left -->
  <path d="M 80 696 L 30 696 L 30 96 L 80 96" class="a-dash" marker-end="url(#arr)"/>

  <!-- Eval branch (right side, hanging off Sync) -->
  <line x1="480" y1="696" x2="560" y2="696" class="a" marker-end="url(#arr)"/>
  <text x="520" y="688" class="annot">every --eval-every steps</text>

  <rect x="560" y="672" width="240" height="92" class="box"/>
  <text x="680" y="692" class="lbl">greedy eval   (no sampling)</text>
  <text x="680" y="712" class="lblsmall">held-out opps  &#215;  seeds  &#215;  2</text>
  <text x="680" y="729" class="lblsmall">(mirror match:  P0 then P1)</text>
  <text x="680" y="751" class="annot">argmax over (rule + &#916;)</text>

  <rect x="560" y="790" width="240" height="60" class="box"/>
  <text x="680" y="810" class="lbl">track best snapshot</text>
  <text x="680" y="830" class="lblsmall">key = (win, margin)  lex order</text>
  <text x="680" y="846" class="annot">restored + exported at end</text>
  <line x1="680" y1="790" x2="680" y2="764" class="a" marker-end="url(#arr)"/>

  <!-- Side annotations -->
  <text x="500" y="96" class="annot" text-anchor="start">opponent distribution</text>
  <text x="500" y="200" class="annot" text-anchor="start">on-policy rollout</text>
  <text x="500" y="310" class="annot" text-anchor="start">sparse, &#177;1 terminal</text>
  <text x="500" y="386" class="annot" text-anchor="start">survives unanimous batches</text>
  <text x="500" y="490" class="annot-rule" text-anchor="start">T must equal sampling T</text>
  <text x="500" y="558" class="annot" text-anchor="start">torch backward</text>
  <text x="500" y="702" class="annot" text-anchor="start">workers see new &#952; next batch</text>

  <!-- Legend -->
  <text x="60" y="900" class="annot-rule" text-anchor="start">&#9632; orange  =  env / no-grad side effects   (env return, weight sync)</text>
  <text x="60" y="918" class="annot" text-anchor="start">&#9633; white   =  learned step   (torch graph, gradient update)</text>
  <text x="60" y="936" class="annot" text-anchor="start">&#9632; blue    =  rollout infrastructure   (workers, batching, logging)</text>
  <text x="60" y="954" class="annot" text-anchor="start">&#8211; &#8211; &#8211; dashed   =   loop back   (next batch reuses updated &#952;)</text>

</svg>
