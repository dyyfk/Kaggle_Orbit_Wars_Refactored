<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="960" viewBox="0 0 760 960">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/>
    </marker>
    <marker id="arr-rule" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b04200"/>
    </marker>
    <style type="text/css"><![CDATA[
      .box   { fill: #ffffff; stroke: #222; stroke-width: 1.5; }
      .rule  { fill: #ffe0b3; stroke: #222; stroke-width: 1.5; }
      .cand  { fill: #d8e8f8; stroke: #222; stroke-width: 1.5; }
      .out   { fill: #ffffff; stroke: #222; stroke-width: 1.5; }
      .gone  { fill: #f3f3f3; stroke: #aaa; stroke-width: 1.2; stroke-dasharray: 4 3; }
      .lbl   { font-family: Arial, Helvetica, sans-serif; font-size: 13px; fill: #222; text-anchor: middle; }
      .lblgone { font-family: Arial, Helvetica, sans-serif; font-size: 13px; fill: #999; text-anchor: middle; text-decoration: line-through; }
      .head  { font-family: Arial, Helvetica, sans-serif; font-size: 16px; fill: #222; text-anchor: middle; font-style: italic; }
      .annot { font-family: Arial, Helvetica, sans-serif; font-size: 11px; fill: #666; text-anchor: middle; font-style: italic; }
      .annot-rule { font-family: Arial, Helvetica, sans-serif; font-size: 11px; fill: #b04200; text-anchor: middle; font-style: italic; }
      .annot-new  { font-family: Arial, Helvetica, sans-serif; font-size: 11px; fill: #0a6b2a; text-anchor: middle; font-weight: bold; }
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 14px; fill: #222; text-anchor: middle; font-weight: bold; }
      .a      { stroke: #222; stroke-width: 1.3; fill: none; }
    ]]></style>
  </defs>

  <text x="380" y="22" class="title">Pure-MLP scorer  (rule residual removed)</text>

  <!-- Output: policy distribution -->
  <text x="380" y="58" class="head">&#960;( a | o<tspan baseline-shift="sub" font-size="10">t</tspan> )</text>

  <!-- Argmax / Softmax box -->
  <rect x="240" y="75" width="280" height="42" class="box"/>
  <text x="380" y="101" class="lbl">Argmax  (eval)   /   Softmax( &#183; / T )  (train)</text>
  <line x1="380" y1="75" x2="380" y2="65" class="a" marker-end="url(#arr)"/>

  <!-- Score vector (no more sum; just MLP output) -->
  <rect x="240" y="140" width="280" height="48" class="box"/>
  <text x="380" y="160" class="lbl">score<tspan baseline-shift="sub" font-size="10">k</tspan>  =  MLP( features<tspan baseline-shift="sub" font-size="10">k</tspan> )</text>
  <text x="380" y="178" class="annot">K-dim vector over candidates  (no residual)</text>
  <line x1="380" y1="140" x2="380" y2="117" class="a" marker-end="url(#arr)"/>

  <!-- Ghost: where the rule branch + sum used to be -->
  <rect x="60" y="218" width="220" height="42" class="gone"/>
  <text x="170" y="237" class="lblgone">rule<tspan baseline-shift="sub" font-size="10">k</tspan>   (heuristic score)</text>
  <text x="170" y="252" class="annot">removed</text>
  <rect x="350" y="218" width="60" height="42" class="gone"/>
  <text x="380" y="247" class="lblgone" font-size="20" font-weight="bold">+</text>

  <!-- MLP stack (now the only branch, centered) -->
  <rect x="270" y="300" width="220" height="42" class="box"/>
  <text x="380" y="327" class="lbl">Scaled  tanh   (score range cap)</text>
  <line x1="380" y1="300" x2="380" y2="188" class="a" marker-end="url(#arr)"/>

  <rect x="270" y="365" width="220" height="42" class="box"/>
  <text x="380" y="392" class="lbl">Linear   (32 &#8594; 1)</text>
  <line x1="380" y1="365" x2="380" y2="342" class="a" marker-end="url(#arr)"/>

  <rect x="270" y="430" width="220" height="42" class="box"/>
  <text x="380" y="457" class="lbl">tanh</text>
  <line x1="380" y1="430" x2="380" y2="407" class="a" marker-end="url(#arr)"/>

  <rect x="270" y="495" width="220" height="42" class="box"/>
  <text x="380" y="522" class="lbl">Linear   (<tspan fill="#0a6b2a" font-weight="bold">18</tspan> &#8594; 32)</text>
  <line x1="380" y1="495" x2="380" y2="472" class="a" marker-end="url(#arr)"/>

  <rect x="270" y="560" width="220" height="42" class="box"/>
  <text x="380" y="587" class="lbl">Z-score normalize   (f &#8722; &#956;) / &#963;</text>
  <line x1="380" y1="560" x2="380" y2="537" class="a" marker-end="url(#arr)"/>

  <!-- 18 features -->
  <rect x="270" y="625" width="220" height="42" class="box"/>
  <text x="380" y="652" class="lbl"><tspan fill="#0a6b2a" font-weight="bold">18</tspan>  features<tspan baseline-shift="sub" font-size="10">k</tspan></text>
  <line x1="380" y1="625" x2="380" y2="602" class="a" marker-end="url(#arr)"/>

  <!-- Side panel: what changed in the feature vector -->
  <rect x="525" y="500" width="220" height="160" fill="#f7fbef" stroke="#0a6b2a" stroke-width="1"/>
  <text x="635" y="520" class="annot-new">feature vector changes</text>
  <text x="540" y="540" class="annot" text-anchor="start" fill="#b04200">&#8722; rule_score   (removed)</text>
  <text x="540" y="560" class="annot" text-anchor="start" fill="#0a6b2a">+ comet_remaining_life</text>
  <text x="540" y="576" class="annot" text-anchor="start" fill="#0a6b2a">+ closest_my_distance</text>
  <text x="540" y="592" class="annot" text-anchor="start" fill="#0a6b2a">+ is_orbiting</text>
  <text x="540" y="616" class="annot" text-anchor="start">the 3 new features carry signals</text>
  <text x="540" y="630" class="annot" text-anchor="start">that previously reached the MLP</text>
  <text x="540" y="644" class="annot" text-anchor="start">only through rule_score.</text>

  <!-- Candidate generator (expanded role: hard vetos live here now) -->
  <rect x="180" y="720" width="400" height="58" class="cand"/>
  <text x="380" y="742" class="lbl">Candidate generator   +   hard vetos</text>
  <text x="380" y="762" class="annot-rule">sun-cross  &#8226;  comet expiry (&lt; COMET_USEFUL_MIN_TURNS)  &#8226;  packet floors</text>
  <line x1="380" y1="720" x2="380" y2="667" class="a" marker-end="url(#arr)"/>

  <!-- Observation -->
  <text x="380" y="820" class="head">o<tspan baseline-shift="sub" font-size="10">t</tspan>   (game state)</text>
  <line x1="380" y1="800" x2="380" y2="778" class="a" marker-end="url(#arr)"/>

  <!-- Side annotations -->
  <text x="380" y="858" class="annot">candidate is dropped (not scored) if any hard veto fires</text>
  <text x="380" y="872" class="annot">&#8594;  MLP only ever ranks LEGAL candidates</text>

  <!-- Footer / legend -->
  <text x="60" y="906" class="annot" text-anchor="start">&#9633; white   =  MLP scorer  (PyTorch; trained via REINFORCE)   &#8212; now scores from scratch, no rule baseline</text>
  <text x="60" y="922" class="annot-rule" text-anchor="start">&#9632; blue    =  candidate generator  (rule-based)   &#8212; absorbs the rule&#8217;s hard-veto role</text>
  <text x="60" y="938" class="annot" text-anchor="start" fill="#999">&#9633; gray    =  removed in this refactor   (rule heuristic score &amp; the rule + &#916; sum)</text>
  <text x="60" y="954" class="annot-new" text-anchor="start">green   =  new vs. residual design   (18 features instead of 16; soft scoring fully learned)</text>

</svg>
